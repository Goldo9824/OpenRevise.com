# Builds OpenRevise on GitHub and uploads it to LWS over FTP.
# Nothing is built or installed on the server. See README, "Deploying".
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERV   address of the LWS FTP server
#   ID         FTP username (use a dedicated FTP account for GitHub)
#   PASSWORD   FTP password

name: Deploy to LWS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads at once.
concurrency:
  group: deploy-lws
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, gd, pdo_mysql, pdo_sqlite, mbstring, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: vendor/bin/phpunit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, gd, pdo_mysql, mbstring, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 1. Build: production PHP packages and the CSS and JavaScript.
      - name: Install PHP packages (no dev tools)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Build CSS and JavaScript
        run: npm ci && npm run build

      # Filament's scripts and styles for the admin panel. Config is never
      # cached here: that would bake GitHub's settings into the files.
      - name: Publish admin panel assets
        run: php artisan filament:assets

      # 2. Assemble: one folder per site, as LWS serves them. The folder
      # names come from the domain.
      - name: Assemble the hosting layout
        run: scripts/assemble.sh dist
        env:
          OPENREVISE_DOMAIN: openrevise.com

      # 3. Upload. The upload action keeps a record of what it sent
      # (.ftp-deploy-sync-state.json on the server) and then sends only changed
      # files. Without the record it would send every file one by one, which
      # takes hours, so the first deploy goes up as one archive instead.
      - name: Look for an earlier deploy on the server
        id: server
        run: scripts/first-deploy.sh check >> "$GITHUB_OUTPUT"
        env:
          FTP_SERV: ${{ secrets.FTP_SERV }}
          FTP_USER: ${{ secrets.ID }}
          FTP_PASSWORD: ${{ secrets.PASSWORD }}

      # Uploads changed files and deletes removed ones. The .env file, the
      # storage folder (lesson files) and uploaded diagrams are not in dist/.
      # The action only ever deletes files it uploaded itself, so it never
      # touches them on the server. On the first deploy this is a dry run that
      # only writes the record for the next step.
      - name: Upload changed files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERV }}
          username: ${{ secrets.ID }}
          password: ${{ secrets.PASSWORD }}
          # Explicit FTP over TLS. If LWS refuses it, change to "ftp" (and
          # remove --ssl-reqd in scripts/first-deploy.sh).
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          dry-run: ${{ steps.server.outputs.first == 'true' }}
          exclude: |
            **/.git*
            **/.git*/**
            openrevise-core/.env
            openrevise-core/storage/**

      # First deploy only: deletes everything already on the server, then
      # uploads the site as one archive and unpacks it there.
      - name: First deploy - upload the site as one archive
        if: steps.server.outputs.first == 'true'
        run: scripts/first-deploy.sh upload dist
        env:
          FTP_SERV: ${{ secrets.FTP_SERV }}
          FTP_USER: ${{ secrets.ID }}
          FTP_PASSWORD: ${{ secrets.PASSWORD }}
          OPENREVISE_DOMAIN: openrevise.com
